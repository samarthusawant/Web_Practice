<!doctype html>
<html>
<head>
    <style>
        .Bootstrap_1 {
            background-color: rgb(121, 82, 179);
            color: rgb(255, 255, 255);
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 20px;
            padding-right: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 8px;
            transition:background-color 0.10s;
        }
        .Bootstrap_1:hover{
            background-color: rgb(100, 60, 150);
            
        }

        .Bootstrap_2 {
            background-color: grey;
            color: white;
            border: none;
            border-style:solid;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 20px;
            padding-right: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
           transition:background-color 0.10s,
            color 0.15s;
            
        }

        .Bootstrap_2:hover{
            background-color: rgb(108, 117, 125);
            color: white;
        }
    
    </style>
</head>
<body>

    <button class="Bootstrap_1">Get started</button>
    <button class="Bootstrap_2">Download</button>

</body>
</html>
