<!doctype html>
<html>
<head>
    <style>
        .linkedin_1 {
            background-color: rgb(10, 102, 194);
            color: rgb(255, 255, 255);
            border: none;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 20px;
            padding-right: 20px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 8px;
            transition: background-color 0.15s;
        }


        .linkedin_1:hover{
            background-color: rgb(3, 70, 140);
        }
        .linkedin_2 {
            background-color: rgb(255, 255, 255);
            color: rgb(10, 102, 194);
            border: none;
            border-color: rgb(10, 102, 194);
            border-style:solid;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 20px;
            padding-right: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-right: 8px;
            border-width: 1px;
            transition: background-color 0.15s,
            border-width 0.15s;
        }

         .linkedin_2:hover{
            background-color: rgb(226, 240, 254);
            border-width: 2px;
         }
    </style>
</head>
<body>

    <button class="linkedin_1">Apply on company website</button>
    <button class="linkedin_2">Save</button>

</body>
</html>
